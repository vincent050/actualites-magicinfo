
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités France</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101722;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  background:#163b65;
  padding:22px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:4px solid #39a9ff;
}
h1{font-size:34px;margin:0}
#clock{font-size:25px;text-align:right}
main{padding:22px 30px}
#status{font-size:18px;color:#b9d7f3;margin-bottom:15px}
#mainNews{
  background:#20364e;
  border-left:8px solid #39a9ff;
  border-radius:8px;
  padding:22px;
  margin-bottom:22px;
  min-height:120px;
}
#mainNews .source{color:#73c5ff;font-weight:bold;font-size:18px}
#mainNews .title{font-size:30px;font-weight:bold;margin-top:12px}
#newsList{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.article{
  background:#1b2939;
  border-radius:7px;
  padding:17px 20px;
  border-left:4px solid #71869d;
  min-height:100px;
}
.article .source{
  font-size:15px;
  color:#73c5ff;
  font-weight:bold;
  margin-bottom:8px;
}
.article a{
  color:#fff;
  text-decoration:none;
  font-size:21px;
  font-weight:bold;
}
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px 25px;
  background:#163b65;
  color:#d7e9f8;
  font-size:15px;
}
@media(max-width:800px){
  h1{font-size:24px}
  #newsList{grid-template-columns:1fr}
  #mainNews .title{font-size:23px}
  .article a{font-size:18px}
  footer{position:static}
}
</style>
</head>
<body>
<header>
  <h1>📰 ACTUALITÉS FRANCE</h1>
  <div id="clock">Chargement...</div>
</header>

<main>
  <div id="status">Chargement des actualités...</div>
  <section id="mainNews">
    <div class="title">Bienvenue sur les actualités</div>
  </section>
  <section id="newsList"></section>
</main>

<footer>
  Sources : Google Actualités et Yahoo Actualités
  — Actualisation automatique toutes les 5 minutes
</footer>

<script>
const clock = document.getElementById("clock");
const statusBox = document.getElementById("status");
const mainNews = document.getElementById("mainNews");
const newsList = document.getElementById("newsList");

function updateClock(){
  const now = new Date();
  clock.textContent = now.toLocaleDateString("fr-FR", {
    weekday:"long", day:"2-digit", month:"long", year:"numeric"
  }) + " • " + now.toLocaleTimeString("fr-FR", {
    hour:"2-digit", minute:"2-digit"
  });
}
updateClock();
setInterval(updateClock, 1000);

function escapeHTML(value){
  return String(value || "").replace(/[&<>"']/g, function(c){
    return {
      "&":"&amp;", "<":"&lt;", ">":"&gt;",
      '"':"&quot;", "'":"&#39;"
    }[c];
  });
}

async function loadNews(){
  try{
    const response = await fetch("./news.json?ts=" + Date.now(), {
      cache:"no-store"
    });
    if(!response.ok) throw new Error("Fichier news.json introuvable");

    const data = await response.json();
    const items = Array.isArray(data.items) ? data.items : [];

    if(items.length === 0){
      statusBox.textContent = "Aucune actualité disponible pour le moment.";
      return;
    }

    const validItems = items.filter(item => item.title && item.link);

    if(validItems.length === 0){
      statusBox.textContent = "Aucun titre disponible.";
      return;
    }

    mainNews.innerHTML = "";
    const first = validItems[0];
    const firstSource = escapeHTML(first.source);
    const firstTitle = escapeHTML(first.title);
    const firstLink = escapeHTML(first.link);

    mainNews.innerHTML =
      '<div class="source">' + firstSource + '</div>' +
      '<div class="title"><a style="color:white;text-decoration:none" href="' +
      firstLink + '" target="_blank">' + firstTitle + '</a></div>';

    newsList.innerHTML = "";
    validItems.slice(1, 11).forEach(item => {
      const article = document.createElement("article");
      article.className = "article";
      article.innerHTML =
        '<div class="source">' + escapeHTML(item.source) + '</div>' +
        '<a href="' + escapeHTML(item.link) +
        '" target="_blank">' + escapeHTML(item.title) + '</a>';
      newsList.appendChild(article);
    });

    const updated = data.updated ? new Date(data.updated) : null;
    statusBox.textContent = "Actualités chargées : " + validItems.length +
      " titres" + (updated && !isNaN(updated) ?
      " • Fichier mis à jour le " + updated.toLocaleString("fr-FR") : "");

  }catch(error){
    statusBox.textContent =
      "Actualités indisponibles. Vérifiez la publication du fichier news.json.";
    console.error(error);
  }
}

loadNews();
setInterval(loadNews, 5 * 60 * 1000);
</script>
</body>
</html>
