
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualités France</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #173b62;
  padding: 24px;
  text-align: center;
  border-bottom: 4px solid #e63946;
}

header h1 {
  margin: 0;
  font-size: 38px;
}

header p {
  margin: 8px 0 0;
  color: #dce8f5;
  font-size: 17px;
}

.container {
  padding: 25px 35px;
}

.article {
  background: #1c2b38;
  border-left: 5px solid #e63946;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 18px;
}

.article h2 {
  margin: 0 0 10px;
  font-size: 25px;
  color: #ffffff;
}

.article p {
  margin: 0 0 12px;
  color: #d5dce3;
  font-size: 18px;
  line-height: 1.4;
}

.article a {
  color: #70c1ff;
  font-size: 16px;
  text-decoration: none;
}

.date {
  color: #aab8c5;
  font-size: 14px;
  margin-bottom: 8px;
}

#etat {
  text-align: center;
  color: #aab8c5;
  font-size: 15px;
  padding: 15px;
}

footer {
  text-align: center;
  color: #8795a2;
  padding: 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🇫🇷 ACTUALITÉS FRANCE</h1>
  <p>Les dernières informations nationales</p>
</header>

<div class="container">
  <div id="etat">Chargement des actualités...</div>
  <div id="actualites"></div>
</div>

<footer>
  Source : Franceinfo
</footer>

<script>
const FLUX = "https://www.franceinfo.fr/titres.rss";

async function chargerActualites() {
  const etat = document.getElementById("etat");
  const zone = document.getElementById("actualites");

  try {
    const reponse = await fetch(FLUX);

    if (!reponse.ok) {
      throw new Error("Erreur de chargement");
    }

    const texte = await reponse.text();
    const xml = new DOMParser().parseFromString(
      texte,
      "text/xml"
    );

    if (xml.querySelector("parsererror")) {
      throw new Error("Erreur de lecture du flux");
    }

    const articles = Array.from(
      xml.querySelectorAll("item")
    ).slice(0, 8);

    if (articles.length === 0) {
      throw new Error("Aucun article disponible");
    }

    zone.innerHTML = "";

    articles.forEach(article => {
      const titre = article.querySelector("title")?.textContent || "";
      const description = article.querySelector("description")?.textContent || "";
      const lien = article.querySelector("link")?.textContent || "#";
      const date = article.querySelector("pubDate")?.textContent || "";

      const bloc = document.createElement("div");
      bloc.className = "article";

      const h2 = document.createElement("h2");
      h2.textContent = titre;

      const dateBloc = document.createElement("div");
      dateBloc.className = "date";
      dateBloc.textContent = date
        ? new Date(date).toLocaleString("fr-FR")
        : "";

      const p = document.createElement("p");
      p.textContent = description.replace(/<[^>]*>/g, "").trim();

      const a = document.createElement("a");
      a.href = lien;
      a.target = "_blank";
      a.textContent = "Lire l'article";

      bloc.appendChild(dateBloc);
      bloc.appendChild(h2);
      bloc.appendChild(p);
      bloc.appendChild(a);

      zone.appendChild(bloc);
    });

    etat.textContent =
      "Dernière mise à jour : " +
      new Date().toLocaleTimeString("fr-FR");

  } catch (erreur) {
    etat.textContent =
      "Actualités temporairement indisponibles.";
  }
}

chargerActualites();
setInterval(chargerActualites, 15 * 60 * 1000);
</script>

</body>
</html>
