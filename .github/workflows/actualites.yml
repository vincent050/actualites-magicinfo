
name: Actualites Manche et France

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualites:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recuperer les flux RSS
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import datetime

          SOURCES = {
              "manche": "https://actu.fr/la-presse-de-la-manche/rss.xml",
              "france": "https://www.franceinfo.fr/titres.rss"
          }

          resultat = {
              "mise_a_jour": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "manche": [],
              "france": []
          }

          for rubrique, url in SOURCES.items():
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      contenu = response.read()

                  racine = ET.fromstring(contenu)

                  for item in racine.findall(".//item")[:4]:
                      titre = item.findtext("title", "").strip()
                      lien = item.findtext("link", "").strip()
                      date = item.findtext("pubDate", "").strip()

                      if titre:
                          resultat[rubrique].append({
                              "titre": titre,
                              "lien": lien,
                              "date": date
                          })

                  print(rubrique, len(resultat[rubrique]), "articles")

              except Exception as erreur:
                  print("Erreur", rubrique, str(erreur))

          with open("news.json", "w", encoding="utf-8") as fichier:
              json.dump(resultat, fichier, ensure_ascii=False, indent=2)

          print("Fichier news.json créé")
          PY

      - name: Enregistrer les actualites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Mise a jour des actualites"
          git push
