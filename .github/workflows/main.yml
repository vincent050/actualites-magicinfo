
name: Mise a jour des actualites

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  actualites:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recuperer les flux RSS
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html
          from datetime import datetime, timezone

          feeds = [
              ("Google Actualites", "https://news.google.com/rss?hl=fr&gl=FR&ceid=FR:fr"),
              ("Yahoo Actualites", "https://fr.news.yahoo.com/rss/france")
          ]

          articles = []
          for source, url in feeds:
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall(".//item")[:10]:
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      pubdate = item.findtext("pubDate", "").strip()
                      if title and link:
                          articles.append({
                              "source": source,
                              "title": html.unescape(title),
                              "link": link,
                              "date": pubdate
                          })
              except Exception as e:
                  print(f"Flux indisponible: {source}: {e}")

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump({
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "items": articles
              }, f, ensure_ascii=False, indent=2)

          print(f"{len(articles)} actualites enregistrees")
          PY

      - name: Publier le fichier actualites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Mise a jour des actualites"
          git push
